name: hugo push to github pages

on:
  push:
    branches:
    - blog

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        # enableGitInfo = true 需要完整 git 历史
        fetch-depth: 0

    - name: Setup Hugo
      # LoveIt 0.3.X 支持 Hugo 0.128.0 - 0.145.0
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.145.0'
        extended: true

    - name: Build
      run: hugo --minify --gc

    - name: Create cname file
      run: echo 'spaceack.com' > public/CNAME

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_branch: master
        publish_dir: ./public
